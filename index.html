<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A6B57">
<meta name="robots" content="noindex,nofollow">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Controle">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:system-ui,sans-serif;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Controle no Celular</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow phone column (max 560px), sticky header, fixed bottom tab bar; the amount is the hero of each form. */
:root{
  --bg:#EDF2EF; --surface:#FFFFFF; --surface-2:#E2E9E5; --ink:#14201C; --ink-2:#4A5A54; --line:#CBD6D1;
  --accent:#0A6B57; --accent-ink:#FFFFFF; --accent-soft:#D2EBE3;
  --good:#1D7A3B; --good-soft:#DAF0E0; --warn:#9A5800; --warn-soft:#FBEACF; --bad:#B3261E; --bad-soft:#F8DDDA; --info:#2D5B88; --info-soft:#DBE6F2;
  --c6:#2A2A2A; --santander:#D2251D; --nubank:#8A05BE; --conta:#0A6B57; --manual:#8C6A2E;
  --shadow:0 1px 2px rgba(20,32,28,.06),0 6px 18px rgba(20,32,28,.06);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px; --r-sm:10px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1311; --surface:#141D1A; --surface-2:#1C2824; --ink:#E5EEEA; --ink-2:#98AAA3; --line:#293732;
  --accent:#3BC3A0; --accent-ink:#04201A; --accent-soft:#12392F;
  --good:#6AD48B; --good-soft:#153221; --warn:#F0B35A; --warn-soft:#3A2A11; --bad:#FF8A80; --bad-soft:#3D1917; --info:#8CB7E7; --info-soft:#162739;
  --c6:#D2D7D5; --santander:#FF5A50; --nubank:#C77DFF; --conta:#3BC3A0; --manual:#D7AE62;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1311; --surface:#141D1A; --surface-2:#1C2824; --ink:#E5EEEA; --ink-2:#98AAA3; --line:#293732;
  --accent:#3BC3A0; --accent-ink:#04201A; --accent-soft:#12392F;
  --good:#6AD48B; --good-soft:#153221; --warn:#F0B35A; --warn-soft:#3A2A11; --bad:#FF8A80; --bad-soft:#3D1917; --info:#8CB7E7; --info-soft:#162739;
  --c6:#D2D7D5; --santander:#FF5A50; --nubank:#C77DFF; --conta:#3BC3A0; --manual:#D7AE62;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:12px}
.muted{color:var(--ink-2)}
.small{font-size:13px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:14px 10px}
.top h1{font-size:22px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 10px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-2);flex:none}
.dot.ok{background:var(--good)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.iconbtn{position:relative;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.iconbtn svg{width:20px;height:20px}
.badge-n{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;display:grid;place-items:center}

/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:0;background:none;border-radius:12px;color:var(--ink-2);font-size:11.5px;font-weight:600}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

/* blocks */
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.section-title{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);margin:6px 2px -4px}
.field{display:flex;flex-direction:column;gap:7px}
.label{font-size:13px;font-weight:700;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.label .hint{font-weight:500}
input.text,select.text,textarea.text{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:11px 12px;font-size:16px;min-width:0}
textarea.text{resize:vertical;min-height:70px}
input.text:focus,select.text:focus,textarea.text:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* money hero */
.money{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px 12px;box-shadow:var(--shadow)}
.money-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);font-weight:600}
.money-line{display:flex;align-items:baseline;gap:8px}
.money-line .cur{font-family:var(--f-display);font-size:24px;font-weight:700;color:var(--ink-2)}
.money-line input{flex:1;min-width:0;border:0;background:transparent;font-family:var(--f-display);font-weight:800;font-size:44px;letter-spacing:-.02em;padding:0;font-variant-numeric:tabular-nums}
.money-line input:focus{outline:none}
.money.zero .money-line input{color:var(--ink-2)}
.money-sub{font-size:13px;color:var(--ink-2);min-height:19px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 13px;font-size:14px;font-weight:600;white-space:nowrap;min-height:38px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .sub{font-weight:500;opacity:.75;font-size:12.5px}
.tripbox{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 10px 10px 12px}
.tripbox.on{border-color:var(--accent)}
.tripbox .t{font-weight:700;font-size:14.5px}
.tripbox .s{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis}
.tripbox .ico{flex:none}
.chip.dashed{border-style:dashed;color:var(--ink-2)}
.bank{width:10px;height:10px;border-radius:3px;flex:none;background:var(--ink-2)}
.bank.C6{background:var(--c6)} .bank.Santander{background:var(--santander)} .bank.Nubank{background:var(--nubank)} .bank.conta{background:var(--conta);border-radius:50%} .bank.manual{background:var(--manual);border-radius:50%}
.chip[aria-pressed="true"] .bank{box-shadow:0 0 0 2px var(--accent-ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:600;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.preview{font-size:13.5px;border-radius:var(--r-sm);padding:9px 11px;background:var(--surface-2);color:var(--ink)}
.preview.err{background:var(--bad-soft);color:var(--bad)}
.preview b{font-weight:700}

details.more{border-top:1px dashed var(--line);padding-top:10px}
details.more>summary{list-style:none;cursor:pointer;font-weight:700;font-size:14px;color:var(--accent);display:flex;align-items:center;gap:6px}
details.more>summary::-webkit-details-marker{display:none}
details.more[open]>summary{margin-bottom:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:700;font-size:15px;min-height:46px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.savebar{position:sticky;bottom:calc(var(--nav-h) + 10px + env(safe-area-inset-bottom,0px));z-index:3;padding-top:4px}
.savebar .btn{width:100%;min-height:54px;font-size:17px;box-shadow:0 8px 24px rgba(10,107,87,.25)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1}

.banner{display:flex;gap:10px;align-items:flex-start;border-radius:var(--r);padding:11px 13px;font-size:14px;background:var(--info-soft);color:var(--ink)}
.banner.warn{background:var(--warn-soft)} .banner.good{background:var(--good-soft)} .banner.bad{background:var(--bad-soft)}
.banner .grow{flex:1;min-width:0}
.banner b{font-weight:700}

/* painel */
.pn-hero{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pn-tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.pn-tile .k{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.pn-tile .v{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn-tile .s{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.pn-mes{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pn-mes b{font-size:17px}
.pn-mes .btn{min-height:40px;padding:6px 14px}
.pn-cols{display:flex;align-items:flex-end;gap:2px;height:150px;padding-top:22px}
.pn-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;border:0;background:none;padding:0;min-width:0;position:relative}
.pn-col .bar{width:62%;max-width:34px;border-radius:4px 4px 0 0;background:var(--accent);opacity:.38;min-height:2px}
.pn-col[aria-pressed="true"] .bar{opacity:1}
.pn-col .lb{font-size:11.5px;color:var(--ink-2);margin-top:6px;font-weight:600}
.pn-col[aria-pressed="true"] .lb{color:var(--ink)}
.pn-col .val{margin-bottom:4px;font-size:11.5px;font-weight:700;color:var(--ink);white-space:nowrap}
.pn-axis{border-top:1px solid var(--line)}
.pn-rows{display:flex;flex-direction:column;gap:11px}
.pn-row{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:center;font-size:14px;border:0;background:none;padding:0;text-align:left;width:100%}
.pn-row .n{display:flex;align-items:center;gap:7px;min-width:0;font-weight:600}
.pn-row .n span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn-row .v{font-weight:700;font-variant-numeric:tabular-nums}
.pn-row .v small{font-weight:500;color:var(--ink-2);margin-left:6px}
.pn-row .track{grid-column:1/-1;height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.pn-row .track i{display:block;height:100%;border-radius:4px;background:var(--accent)}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:12.5px;color:var(--ink-2);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.item .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.ico svg{width:18px;height:18px}
.ico.pag{background:var(--good-soft);color:var(--good)} .ico.via{background:var(--info-soft);color:var(--info)}
.daylabel{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding:14px 2px 2px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 8px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.muted{background:var(--surface-2);color:var(--ink-2)}
.pill.rat{background:var(--accent-soft);color:var(--accent);max-width:100%;overflow:hidden;text-overflow:ellipsis}

/* saldos */
.pair{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.pair-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.pair-h .arrow{color:var(--ink-2)}
.pair-amt{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.pair-amt.zero{color:var(--ink-2)}
.pair-meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--ink-2);margin-top:4px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.kv .k{color:var(--ink-2)} .kv .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.kv .tot{border-top:1px solid var(--line);padding-top:8px;font-size:16px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
.tbl .obs{color:var(--ink-2);font-size:12px}
.month{font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding-top:12px}
.receipt{background:var(--surface-2);border-radius:var(--r);padding:10px;text-align:center}
img{max-width:100%}
.receipt img{display:block;margin:0 auto;width:100%;height:auto;max-width:420px;border-radius:8px;box-shadow:var(--shadow)}

.drop{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--accent);border-radius:var(--r);padding:14px;background:var(--accent-soft);color:var(--ink);cursor:pointer;width:100%;text-align:left}
.drop svg{width:26px;height:26px;color:var(--accent);flex:none}
.drop input{display:none}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--accent-soft);border-top-color:var(--accent);animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

.suggest{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);overflow:hidden;margin-top:-2px}
.suggest button{border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:10px 12px;display:flex;justify-content:space-between;gap:8px}
.suggest button:last-child{border-bottom:0}
.suggest .sub{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.empty{text-align:center;padding:26px 14px;color:var(--ink-2)}
.empty h3{color:var(--ink);font-size:18px;margin-bottom:6px}
.confirm{border:1px solid var(--bad);background:var(--bad-soft);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}

[hidden]{display:none!important}
#toast{position:fixed;left:16px;right:16px;margin:0 auto;width:fit-content;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:20;display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--bg);border-radius:12px;padding:11px 14px;font-weight:600;font-size:14px;max-width:min(92vw,520px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast button{border:0;background:none;color:var(--accent-soft);font-weight:800;padding:2px 4px}
.help p{margin:0 0 8px} .help ol{margin:0;padding-left:20px} .help li{margin-bottom:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <h1 id="title">Lançar</h1>
    <span class="sync" id="sync"><span class="dot"></span><span>Iniciando…</span></span>
    <button class="iconbtn" id="btn-planilha" aria-label="Configurações" data-go="config">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span class="badge-n" id="badge-envio" hidden>0</span>
    </button>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Seções">
  <div class="tabs-in">
    <button class="tab" data-go="lancar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19M6.5 15h4"/></svg>Lançar</button>

<div id="toast" hidden></div>

<script>
"use strict";
/* ---------- defaults (cadastros da planilha; o arquivo da planilha atualiza) ---------- */
/* Nada pessoal no código: pessoas, cartões, lojas e saldos entram pelo arquivo resumo-celular.json da planilha e ficam só no aparelho. */
const DEFAULTS = {
  pessoas:[],
  meios:[],
  categorias:["Assinaturas","Beleza","Carro","Casa","Combustível","Compras online","Delivery","Educação","Eletrônicos","Farmácia","Filhos","Lazer","Mercado","Pets","Presentes","Restaurante","Saúde","Seguros","Serviços","TAG / Estacionamento","Tarifas bancárias","Trabalho","Transporte","Vestuário","Viagem","Outros"],
  lojas:[]
};
const MANUAL = {chave:"manual",tipo:"Manual",banco:"",titular:"",final:"",nome:"Dinheiro ou outra conta",rateio:""};
const VIAGEM_CATS = ["Combustível","TAG / Estacionamento"];

/* ---------- helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/\s+/g," ").trim();
function fmt(c){c=Math.round(c||0);const neg=c<0;c=Math.abs(c);const r=Math.floor(c/100).toString().replace(/\B(?=(\d{3})+(?!\d))/g,".");return (neg?"−":"")+r+","+String(c%100).padStart(2,"0")}
const brl = c => "R$ "+fmt(c);
const cents = v => Math.round((Number(v)||0)*100);
function pad(n){return String(n).padStart(2,"0")}
function today(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function addDays(s,n){const [y,m,d]=s.split("-").map(Number);const t=new Date(y,m-1,d+n);return t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate())}
function addMonths(s,n){const [y,m,d]=s.split("-").map(Number);const last=new Date(y,m-1+n+1,0).getDate();const t=new Date(y,m-1+n,Math.min(d,last));return t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate())}
function dmy(s){if(!s)return "";const [y,m,d]=s.slice(0,10).split("-");return d+"/"+m+"/"+y}
function dm(s){if(!s)return "";const [y,m,d]=s.slice(0,10).split("-");return d+"/"+m}
const MESES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
function mesAno(s){const [y,m]=s.split("-");return MESES[+m-1]+"/"+y}
function dayLabel(s){const t=today();if(s===t)return "Hoje";if(s===addDays(t,-1))return "Ontem";const [y,m,d]=s.split("-").map(Number);const w=["domingo","segunda","terça","quarta","quinta","sexta","sábado"][new Date(y,m-1,d).getDay()];return w+", "+dm(s)}
function nowIso(){return new Date().toISOString()}
function dtBR(iso){if(!iso)return "";const d=new Date(iso);if(isNaN(d))return dmy(iso);return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear()+" "+pad(d.getHours())+":"+pad(d.getMinutes())}
function newId(k){return k+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function lsGet(k,def){try{const v=localStorage.getItem("cf."+k);return v==null?def:JSON.parse(v)}catch(e){return def}}
function lsSet(k,v){try{localStorage.setItem("cf."+k,JSON.stringify(v))}catch(e){}}
function parseMoneyText(t){t=String(t||"").trim().replace(/[R$\s]/g,"");if(!t)return NaN;if(t.includes(","))t=t.replace(/\./g,"").replace(",",".");else if(/^\d{1,3}(\.\d{3})+$/.test(t))t=t.replace(/\./g,"");const v=parseFloat(t);return isNaN(v)?NaN:Math.round(v*100)}
function toast(msg,undo){const t=$("#toast");t.innerHTML="<span>"+esc(msg)+"</span>"+(undo?'<button type="button" id="toast-undo">Desfazer</button>':"");t.hidden=false;clearTimeout(toast._t);if(undo)$("#toast-undo").onclick=()=>{t.hidden=true;undo()};toast._t=setTimeout(()=>{t.hidden=true},undo?6000:2800)}

/* ---------- state ---------- */
const S = {
  route:"lancar", eu:lsGet("eu",""),
  items:lsGet("items",{}), outbox:lsGet("outbox",{}),
  plan:lsGet("plan",null), app:lsGet("app",{ultimoEnvio:null,ultimoEnvioPor:""}),
  mode:"iniciando", db:null, dl:null, flushing:false, loadTimer:null, remoteSeen:false,
  form:null, pform:null, moreOpen:false, storageOk:null, verTodas:false, vform:null, saldoSel:null, histFiltro:"todos", histBusca:"", confirmDel:false, comp:null, readState:null
};
function pessoasTodas(){const p=S.plan;const base=((p&&p.pessoas&&p.pessoas.length)?p.pessoas:DEFAULTS.pessoas).slice();const ex=lsGet("pessoasExtras",[]);ex.forEach(n=>{if(!base.some(b=>norm(b.nome)===norm(n)))base.push({nome:n,nomesBancos:[],extra:true})});return base}
/* botões de pessoas: escolhidos em Configurações; nome que ainda não foi visto entra como "novo" e só vira botão quando marcado */
function botoesPessoas(){const todos=pessoasTodas().map(p=>p.nome);let vis=lsGet("botoesPessoas",null);
  if(!vis){if(!todos.length)return [];vis=todos.slice();lsSet("botoesPessoas",vis);lsSet("pessoasConhecidas",todos.slice());return vis}
  if(!lsGet("pessoasConhecidas",null))lsSet("pessoasConhecidas",todos.slice());
  return todos.filter(n=>vis.includes(n))}
function pessoasNovas(){const k=lsGet("pessoasConhecidas",null);if(!k)return [];return pessoasTodas().map(p=>p.nome).filter(n=>!k.includes(n))}
function meiosTodos(){const p=S.plan;const base=((p&&p.meios&&p.meios.length)?p.meios:DEFAULTS.meios).slice();const ex=lsGet("meiosExtras",[]);ex.forEach(m=>{if(!base.some(b=>b.chave===m.chave))base.push({...m,extra:true})});return base}
function cfg(){const p=S.plan;return {pessoas:pessoasTodas(),meios:meiosTodos(),categorias:(p&&p.categorias&&p.categorias.length)?p.categorias:DEFAULTS.categorias,lojas:(p&&p.lojas)||DEFAULTS.lojas}}
const nomes = ()=>cfg().pessoas.map(p=>p.nome);
function meioByKey(k){if(k==="manual")return MANUAL;return cfg().meios.find(m=>m.chave===k)||null}
function itemsArr(kind){return Object.values(S.items).filter(i=>!i.excluido&&(!kind||i.kind===kind))}
function storageFunciona(){try{const k="cf.__t";localStorage.setItem(k,"1");const ok=localStorage.getItem(k)==="1";localStorage.removeItem(k);return ok}catch(e){return false}}
function persist(){lsSet("items",S.items);lsSet("outbox",S.outbox)}

/* ---------- rateio (mesmas regras da planilha, item 4) ---------- */
function resolveNome(tok){const n=norm(tok);const ps=nomes();const ex=ps.find(p=>norm(p)===n);if(ex)return ex;if(n.length<2)return null;const pre=ps.filter(p=>norm(p).startsWith(n));return pre.length===1?pre[0]:null}
function parseRateio(txt,total,titular){
  const t=String(txt||"").trim();
  if(!t)return {padrao:true};
  if(t==="-")return titular?{ok:true,parts:[{nome:titular,c:total}]}:{ok:false,erro:"sem titular"};
  const sep=t.includes(";")?";":",";
  const toks=t.split(sep).map(s=>s.trim()).filter(Boolean);
  const fixed=[],eq=[],order=[];
  for(const tk of toks){
    const m=tk.match(/^(.+?)\s+(-?[\d.,]+)$/);
    const nomeTxt=m?m[1]:tk; const nome=resolveNome(nomeTxt);
    if(!nome)return {ok:false,erro:"nome desconhecido: "+nomeTxt};
    if(!order.includes(nome))order.push(nome);
    if(m){const v=parseMoneyText(m[2]);if(isNaN(v)||v<0)return {ok:false,erro:"valor inválido: "+m[2]};fixed.push({nome,c:v})}
    else if(!eq.includes(nome))eq.push(nome);
  }
  const sumF=fixed.reduce((a,b)=>a+b.c,0);const res={};order.forEach(n=>res[n]=0);fixed.forEach(f=>res[f.nome]+=f.c);
  if(!total){return {ok:true,parts:order.map(n=>({nome:n,c:0})),semValor:true,iguais:eq.length,fixos:fixed.length}}
  if(!eq.length){if(sumF!==total)return {ok:false,erro:"não fecha o total (dif. "+fmt(total-sumF)+")"}}
  else{const rest=total-sumF;if(rest<0)return {ok:false,erro:"valores fixos maiores que o total"};const base=Math.floor(rest/eq.length);let extra=rest-base*eq.length;eq.forEach(n=>{res[n]+=base+(extra>0?1:0);if(extra>0)extra--})}
  return {ok:true,parts:order.map(n=>({nome:n,c:res[n]})).filter(p=>p.c!==0||eq.includes(p.nome))};
}
function nomesDoTexto(t){const sep=String(t||"").includes(";")?";":",";return String(t||"").split(sep).map(x=>x.trim()).filter(Boolean).map(tk=>{const m=tk.match(/^(.+?)\s+(-?[\d.,]+)$/);return resolveNome(m?m[1]:tk)}).filter(Boolean)}
function alternaNomeNoTexto(t,nome){t=String(t||"").trim();const toks=t?t.split(t.includes(";")?";":",").map(x=>x.trim()).filter(Boolean):[];
  const has=toks.filter(tk=>{const m=tk.match(/^(.+?)\s+(-?[\d.,]+)$/);return resolveNome(m?m[1]:tk)===nome});
  if(has.length)return toks.filter(tk=>!has.includes(tk)).join("; ");return toks.concat([nome]).join("; ")}
function erroRateioHtml(erro){const m=/^nome desconhecido: (.+)$/.exec(erro);const n=m?m[1].trim():"";return esc("Rateio: "+erro)+(n.length>=2&&!/\d/.test(n)?' <button type="button" class="chip" style="margin-left:6px;min-height:30px;padding:4px 10px" data-addpessoa="'+esc(n)+'">Adicionar '+esc(capital(n))+'</button>':"")}
function partsText(r){if(!r||!r.ok)return "";if(r.semValor)return r.parts.map(p=>p.nome).join(" · ")+(r.fixos?"":" · partes iguais");return r.parts.map(p=>p.nome+" "+fmt(p.c)).join(" · ")}
function viagensAtivas(data,meioKey){return itemsArr("viagem").filter(v=>{const okData=v.modo==="datas"?(v.datas||[]).includes(data):(data>=v.de&&(!v.ate||data<=v.ate));const okMeio=meioKey==null||!v.meios||!v.meios.length||v.meios.includes(meioKey);return okData&&okMeio})}
function lojaByNome(n){const k=norm(n);if(!k)return null;return cfg().lojas.find(l=>norm(l.nome)===k)||null}
function categoriaDe(it){if(it.categoria)return it.categoria;const l=lojaByNome(it.loja||it.descricao);return l?l.categoria:""}
/* rateio efetivo de uma compra: Compra → Viagem → Loja → Cartão/Conta → titular */
function rateioEfetivo(it){
  const m=meioByKey(it.meio)||MANUAL;const titular=it.meio==="manual"?(it.pagoPor||""):m.titular;
  if(it.rateio)return {txt:it.rateio,origem:it.viagem?"viagem":"compra",titular};
  const cat=categoriaDe(it);
  const v=viagensAtivas(it.data,it.meio).find(v=>(v.categorias||[]).includes(cat));
  if(v)return {txt:v.rateio,origem:"viagem "+v.nome,titular};
  const l=lojaByNome(it.loja||it.descricao);if(l&&l.rateio)return {txt:l.rateio,origem:"padrão da loja",titular};
  if(m.rateio)return {txt:m.rateio,origem:m.tipo==="Conta"?"padrão do débito":"padrão do cartão",titular};
  return {txt:"-",origem:"titular",titular};
}

/* ---------- planilha (resumo vindo do Excel) ---------- */
function situacao(id){const c=S.plan&&S.plan.celular;return c?c[id]:null}
function statusItem(it){
  const s=situacao(it.id);const env=S.app.ultimoEnvio;const enviado=!!env&&(it.alteradoEm||"")<=env;
  if(!enviado)return {cls:"muted",txt:s?"Alterado, não enviado":"Não enviado",det:""};
  const map={ligado:["good","Na fatura"],manual:["good","Em Gastos manuais"],registrado:["good","Na planilha"],aplicada:["good","Aplicada"],duvida:["warn","Escolher na planilha"],"sem-fatura":["bad","Não apareceu na fatura"],erro:["bad","Erro na planilha"]};
  const m=s&&map[s.situacao];if(m)return {cls:m[0],txt:m[1],det:s.texto||""};
  return {cls:"info",txt:it.kind==="compra"&&it.meio!=="manual"?"Aguardando fatura":"Aguardando planilha",det:""};
}
function needsAttention(it){const s=statusItem(it);return s.cls==="warn"||s.cls==="bad"}
function pendentesEnvio(){const env=S.app.ultimoEnvio||"";return Object.values(S.items).filter(i=>(i.alteradoEm||"")>env).length}

/* saldos: planilha + pagamentos do celular ainda não registrados + compras aguardando fatura */
function pagamentosNaoRegistrados(){return itemsArr("pagamento").filter(p=>{const s=situacao(p.id);return !(s&&s.situacao==="registrado")})}
function comprasAguardando(){return itemsArr("compra").filter(c=>{const s=situacao(c.id);return !(s&&(s.situacao==="ligado"||s.situacao==="manual"))})}
function estimativasCelular(){
  const map={};
  for(const c of comprasAguardando()){
    const re=rateioEfetivo(c);const r=parseRateio(re.txt,c.valor,re.titular);if(!r.ok||r.semValor)continue;
    for(const p of r.parts){if(p.nome===re.titular||!re.titular||p.c<=0)continue;const k=p.nome+"|"+re.titular;(map[k]=map[k]||{c:0,itens:[]});map[k].c+=p.c;map[k].itens.push({it:c,c:p.c})}
  }
  return map;
}
function paresView(){
  const pares=(S.plan&&S.plan.pares)||[];const pagos=pagamentosNaoRegistrados();const est=estimativasCelular();
  const out=pares.map(p=>({...p,pendC:cents(p.pendente),avC:cents(p.aVencer),pagCel:0,pagCelItens:[],estC:0,estItens:[]}));
  const find=(d,c)=>out.find(p=>p.devedor===d&&p.pagaA===c);
  for(const pg of pagos){let p=find(pg.pagador,pg.recebedor);if(!p){p={devedor:pg.pagador,pagaA:pg.recebedor,pendC:0,avC:0,itens:[],pagamentos:[],pagCel:0,pagCelItens:[],estC:0,estItens:[],novo:true};out.push(p)}p.pagCel+=pg.valor;p.pagCelItens.push(pg)}
  for(const k in est){const [d,c]=k.split("|");let p=find(d,c);if(!p){p={devedor:d,pagaA:c,pendC:0,avC:0,itens:[],pagamentos:[],pagCel:0,pagCelItens:[],estC:0,estItens:[],novo:true};out.push(p)}p.estC+=est[k].c;p.estItens=est[k].itens}
  out.forEach(p=>{p.agora=p.pendC-p.pagCel});
  return out;
}

/* ---------- storage: db compartilhado (todos os aparelhos) ou só este aparelho ---------- */
function setMode(m){S.mode=m;renderSync()}
function renderSync(){
  const el=$("#sync");const n=Object.keys(S.outbox).length;let cls="",txt="";
  if(S.mode==="iniciando"){cls="";txt="Conectando…"}
  else if(S.mode==="compartilhado"){cls=n?"warn":"ok";txt=n?n+" para sincronizar":"Sincronizado"}
  else if(S.mode==="offline"){cls="warn";txt=n?"Sem conexão · "+n+" no aparelho":"Sem conexão"}
  else if(S.mode==="leitura"){cls="warn";txt="Só leitura"}
  else {cls="";txt="Só neste aparelho"}
  el.innerHTML='<span class="dot '+cls+'"></span><span>'+esc(txt)+'</span>';
  const b=$("#badge-envio");const pe=pendentesEnvio()+pessoasNovas().length;b.hidden=!pe;b.textContent=pe>99?"99+":pe;
}
async function initCaps(){
  const use=window.claude&&typeof window.claude.use==="function"?n=>window.claude.use(n).catch(()=>null):async()=>null;
  use("downloads").then(d=>{S.dl=d;if(S.route==="config"||S.route==="saldos")render()});
  S.loadTimer=setTimeout(()=>{if(!S.remoteSeen){if(S.db)setMode("offline");}},10000);
  const db=await use("db");
  if(!db){clearTimeout(S.loadTimer);setMode("local");S.storageOk=storageFunciona();try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}render();return}
  S.db=db;
  db.collection("itens").onSnapshot(snap=>{
    S.remoteSeen=true;clearTimeout(S.loadTimer);
    let changed=false;
    for(const d of snap.docs){const r=d.data();if(!r||!r.id)continue;const l=S.items[r.id];
      if(S.outbox[r.id]&&l&&(l.alteradoEm||"")>(r.alteradoEm||""))continue;
      if(S.outbox[r.id]&&l&&(l.alteradoEm||"")<=(r.alteradoEm||""))delete S.outbox[r.id];
      if(!l||l.alteradoEm!==r.alteradoEm){S.items[r.id]=JSON.parse(JSON.stringify(r));changed=true}}
    if(!snap.metadata.fromCache)setMode("compartilhado");
    persist();if(changed)render();else renderSync();flush();
  },e=>{setMode(e&&e.code==="revoked"?"local":"offline")});
  db.collection("planilha").onSnapshot(snap=>{
    const docs={};snap.docs.forEach(d=>{docs[d.id]=d.data()});const meta=docs.meta;if(!meta)return;
    const plan=assemblePlan(meta,docs);if(!S.plan||plan.gen!==S.plan.gen||plan.partial!==S.plan.partial){S.plan=plan;lsSet("plan",plan);render()}
  },()=>{});
  db.doc("app/estado").onSnapshot(snap=>{if(snap.exists){const a=snap.data();if((a.ultimoEnvio||"")!==(S.app.ultimoEnvio||"")){S.app={...S.app,...a};lsSet("app",S.app);render()}}},()=>{});
  window.addEventListener("online",flush);document.addEventListener("visibilitychange",()=>{if(!document.hidden)flush()});
}
function assemblePlan(meta,docs){
  const plan={gen:meta.gen,geradoEm:meta.geradoEm,planilhaVersao:meta.planilhaVersao,importadoEm:meta.importadoEm,importadoPor:meta.importadoPor,pessoas:meta.pessoas,meios:meta.meios,categorias:meta.categorias,lojas:meta.lojas||[],pares:(meta.pares||[]).map(p=>({...p,itens:[],pagamentos:[]})),celular:{},partial:false};
  for(const name of (meta.docs||[])){const d=docs[name];if(!d){plan.partial=true;continue}
    if(d.tipo==="par"){const p=plan.pares[d.i];if(p){p.itens.push(...(d.itens||[]));p.pagamentos.push(...(d.pagamentos||[]))}}
    else if(d.tipo==="status")Object.assign(plan.celular,d.celular||{});}
  return plan;
}
async function flush(){
  if(!S.db||S.flushing||S.mode==="leitura")return;S.flushing=true;
  try{for(const id of Object.keys(S.outbox)){const it=S.items[id];if(!it){delete S.outbox[id];continue}
      try{await S.db.collection("itens").doc(id).set(it);if(S.items[id]&&S.items[id].alteradoEm===it.alteradoEm)delete S.outbox[id]}
      catch(e){if(e&&e.code==="invalid_argument"){setMode("leitura");break}
        if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,1200+Math.random()*800));try{await S.db.collection("itens").doc(id).set(it);delete S.outbox[id];continue}catch(e2){}}
        if(e&&e.code==="quota_exceeded")toast("O espaço de dados está cheio. Baixe um backup e apague itens antigos.");
        break}}
  }finally{S.flushing=false;persist();renderSync()}
}
function saveItem(it,msg,undoPrev){
  it.alteradoEm=nowIso();if(!it.criadoEm)it.criadoEm=it.alteradoEm;it.por=it.por||S.eu||"";
  const prev=S.items[it.id]?JSON.parse(JSON.stringify(S.items[it.id])):null;
  S.items[it.id]=it;S.outbox[it.id]=1;persist();flush();renderSync();
  toast(msg,()=>{if(prev){prev.alteradoEm=nowIso();S.items[it.id]=prev}else{S.items[it.id]={...it,excluido:true,alteradoEm:nowIso()}}S.outbox[it.id]=1;persist();flush();render()});
}

/* ---------- router ---------- */
const TITLES={lancar:"Lançar",pagamento:"Pagamento",saldos:"Quem deve",viagens:"Viagens",historico:"Histórico",painel:"Painel",config:"Configurações"};
function go(r){if(!TITLES[r])r="lancar";S.route=r;S.confirmDel=false;S.verTodas=false;if(location.hash!=="#"+r){try{history.replaceState(null,"","#"+r)}catch(e){location.hash=r}}render();window.scrollTo(0,0)}
window.addEventListener("hashchange",()=>{const r=location.hash.slice(1);if(r&&r!==S.route&&TITLES[r]){S.route=r;render()}});
function capital(n){return String(n).trim().split(/\s+/).map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(" ")}
function addPessoa(nome){nome=capital(nome);if(!nome||nome.length<2)return false;if(pessoasTodas().some(p=>norm(p.nome)===norm(nome))){toast(nome+" já existe");return false}
  const ex=lsGet("pessoasExtras",[]);ex.push(nome);lsSet("pessoasExtras",ex);const vis=lsGet("botoesPessoas",[]);if(!vis.includes(nome)){vis.push(nome);lsSet("botoesPessoas",vis)}const k=lsGet("pessoasConhecidas",[]);if(!k.includes(nome)){k.push(nome);lsSet("pessoasConhecidas",k)}
  toast(nome+" adicionada às pessoas");return true}
document.addEventListener("click",e=>{const ap=e.target.closest("[data-addpessoa]");if(ap){if(addPessoa(ap.dataset.addpessoa))render()}});
document.addEventListener("click",e=>{const vt=e.target.closest("[data-vertodas]");if(vt){S.verTodas=true;render()}});
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g){e.preventDefault();if(g.dataset.go==="lancar"&&S.route==="lancar"&&S.form&&S.form.id){S.form=null}go(g.dataset.go)}});
function render(){
  $("#title").textContent=(S.route==="lancar"&&S.form&&S.form.id)?"Editar compra":(S.route==="pagamento"&&S.pform&&S.pform.id)?"Editar pagamento":TITLES[S.route];
  $$(".tab").forEach(t=>t.setAttribute("aria-current",(t.dataset.go===S.route||(t.dataset.go==="painel"&&S.route==="historico"))?"page":"false"));
  $("#btn-planilha").setAttribute("aria-current",S.route==="config"?"page":"false");
  const v=$("#view");
  if(!cfg().pessoas.length&&S.mode!=="iniciando"&&S.route!=="planilha"){viewSetup(v);renderSync();return}
  ({lancar:viewLancar,pagamento:viewPagamento,saldos:viewSaldos,viagens:viewViagens,historico:viewHistorico,painel:viewPainel,config:viewPlanilha})[S.route](v);

function moneyInput(id,c,label,right){return '<div class="money'+(c?"":" zero")+'" id="'+id+'-box"><div class="money-top"><span>'+esc(label)+'</span>'+(right||"")+'</div><div class="money-line"><span class="cur">R$</span><input id="'+id+'" inputmode="numeric" autocomplete="off" aria-label="'+esc(label)+'" value="'+fmt(c)+'"></div><div class="money-sub" id="'+id+'-sub"></div></div>'}
function bindMoney(id,get,set,after){const el=$("#"+id);if(!el)return;
  const show=c=>{c=Math.max(0,Math.min(99999999999,c));set(c);el.value=fmt(c);$("#"+id+"-box").classList.toggle("zero",!c);try{el.setSelectionRange(el.value.length,el.value.length)}catch(e){}if(after)after()};
  const toEnd=()=>setTimeout(()=>{try{el.setSelectionRange(el.value.length,el.value.length)}catch(e){}},0);
  el.addEventListener("focus",toEnd);el.addEventListener("click",toEnd);
  el.addEventListener("beforeinput",e=>{const t=e.inputType||"";
    if(t==="insertText"||t==="insertReplacementText"){e.preventDefault();const d=String(e.data||"").replace(/\D/g,"");if(!d)return;const all=el.selectionStart===0&&el.selectionEnd===el.value.length&&el.value.length>0;show((all?0:get())*Math.pow(10,d.length)+parseInt(d,10));return}
    if(t.startsWith("delete")){e.preventDefault();const all=el.selectionStart===0&&el.selectionEnd===el.value.length;show(all?0:Math.floor(get()/10));return}});
  el.addEventListener("input",()=>{show(parseInt(el.value.replace(/\D/g,"").replace(/^0+/,"").slice(0,11)||"0",10))});
  el.addEventListener("paste",e=>{const t=(e.clipboardData&&e.clipboardData.getData("text"))||"";const c=parseMoneyText(t);if(!isNaN(c)){e.preventDefault();show(c)}})}

  return '<div class="chips scroll" role="group" aria-label="Data">'+opts.map(o=>'<button type="button" class="chip" data-date="'+o[0]+'" aria-pressed="'+(o[0]===val)+'">'+o[1]+' <span class="sub">'+dm(o[0])+'</span></button>').join("")+'<input type="date" class="text" id="'+id+'" value="'+esc(val)+'" style="width:auto;flex:none;padding:7px 10px;font-size:15px'+(isOther?";border-color:var(--accent)":"")+'" aria-label="Escolher data"></div>'}

  if(f.rateioModo==="titular")return "-";
  if(f.rateioModo==="pessoas")return f.pessoas.join("; ");

function draftItem(f){const m=meioByKey(f.meio)||MANUAL;const t=totais(f);const l=lojaByNome(f.loja||f.descricao);
  return {id:f.id,kind:"compra",data:f.data,valor:t.total,parcelas:Math.max(1,f.parcelas|0),valorParcela:t.parcela,valorDigitado:f.valorEh,meio:m.chave,tipoMeio:m.tipo,banco:m.banco,titular:m.chave==="manual"?f.pagoPor:m.titular,final:m.final,pagoPor:m.chave==="manual"?f.pagoPor:"",descricao:f.descricao.trim(),loja:f.loja||(l?l.nome:""),rateio:rateioDoForm(f),rateioModo:f.rateioModo,pessoas:f.rateioModo==="pessoas"?f.pessoas.slice():[],viagem:f.rateioModo==="viagem"?f.viagemId:"",categoria:f.categoria,obs:f.obs.trim(),aproximado:!!f.aproximado,excluido:false}}
function historicoSugestoes(q){
  const qn=norm(q);const seen=new Map();
  itemsArr("compra").sort((a,b)=>(b.alteradoEm||"").localeCompare(a.alteradoEm||"")).forEach(i=>{const k=norm(i.descricao);if(!k||seen.has(k))return;if(qn&&!k.includes(qn))return;seen.set(k,{tipo:"hist",it:i})});
  const out=[...seen.values()].slice(0,qn?4:6);
  if(qn&&qn.length>=2){cfg().lojas.filter(l=>norm(l.nome).includes(qn)&&!seen.has(norm(l.nome))).slice(0,6-out.length).forEach(l=>out.push({tipo:"loja",l}))}
  return out;
}

function mesKey(s){return String(s||"").slice(0,7)}
function mesTxt(k){const [y,m]=k.split("-");return MESES[+m-1]+"/"+y}
function mesCurto(k){return MESES[+k.split("-")[1]-1]}
function addMes(k,n){return addMonths(k+"-01",n).slice(0,7)}
function partesDe(c){const re=rateioEfetivo(c);const r=parseRateio(re.txt,c.valor,re.titular);if(r.ok&&!r.semValor)return r.parts;return re.titular?[{nome:re.titular,c:c.valor}]:[]}
function pnRows(list,total,fmtNome){if(!list.length)return '<div class="muted small">Nada neste mês.</div>';const max=Math.max(...list.map(x=>x.c),1);
  return '<div class="pn-rows">'+list.map(x=>'<div class="pn-row"><span class="n">'+(fmtNome?fmtNome(x):'<span class="t">'+esc(x.nome)+'</span>')+'</span><span class="v">'+brl(x.c)+(total?'<small>'+Math.round(x.c*100/total)+'%</small>':'')+'</span><span class="track"><i style="width:'+Math.max(2,Math.round(x.c*100/max))+'%"></i></span></div>').join("")+'</div>'}
function agrupa(arr,keyFn){const m=new Map();for(const [k,c] of arr){if(!c)continue;const kk=keyFn?keyFn(k):k;m.set(kk,(m.get(kk)||0)+c)}return [...m].map(([nome,c])=>({nome,c})).sort((a,b)=>b.c-a.c)}
function pnColunas(meses,valores,sel,attr){const max=Math.max(...valores,1);
  return '<div class="pn-cols">'+meses.map((k,i)=>{const h=Math.round(valores[i]*100/max);const on=k===sel;return '<button type="button" class="pn-col" '+attr+'="'+k+'" aria-pressed="'+on+'" aria-label="'+esc(mesTxt(k)+": "+brl(valores[i]))+'" title="'+esc(mesTxt(k)+": "+brl(valores[i]))+'">'+(on?'<span class="val">'+esc(brl(valores[i]).replace("R$ ",""))+'</span>':'')+'<span class="bar" style="height:'+(valores[i]?Math.max(3,h*0.72):0)+'%"></span><span class="lb">'+mesCurto(k)+'</span></button>'}).join("")+'</div><div class="pn-axis"></div>'}
function viewPainel(v){

  const minha=eu?doMes.reduce((t,c)=>t+partesDe(c).filter(p=>p.nome===eu).reduce((a,p)=>a+p.c,0),0):0;
  let html='<div class="stack">';
  html+='<div class="pn-mes"><button type="button" class="btn" data-pnmes="'+addMes(sel,-1)+'" aria-label="Mês anterior">‹</button><b>'+esc(mesTxt(sel))+(sel===hoje?' <span class="muted small" style="font-weight:600">este mês</span>':'')+'</b><button type="button" class="btn" data-pnmes="'+addMes(sel,1)+'" aria-label="Próximo mês"'+(sel>=hoje?' disabled':'')+'>›</button></div>';
  html+='<div class="pn-hero"><div class="pn-tile"><div class="k">Compras lançadas</div><div class="v">'+brl(total)+'</div><div class="s">'+doMes.length+(doMes.length===1?' compra':' compras')+'</div></div>';

    const pes=agrupa(doMes.flatMap(c=>partesDe(c).map(p=>[p.nome,p.c])));

  if(vgs.length)html+='<div class="section-title">Viagens</div><div class="card"><div class="kv">'+vgs.map(o=>'<span class="k"><b style="color:var(--ink)">'+esc(o.x.nome)+'</b><br><span class="small">'+o.cs.length+(o.cs.length>1?' lançamentos':' lançamento')+' · '+esc(periodoTxt(o.x))+'</span></span><span class="v" style="text-align:right;font-weight:700">'+brl(o.t)+'<br><span class="small muted" style="font-weight:500">'+brl(Math.round(o.t/Math.max(1,(o.x.pessoas||[]).length)))+' por pessoa</span></span>').join("")+'</div></div>';
  // quem deve
  if(eu){const ps=paresView();const meDevem=ps.filter(p=>p.pagaA===eu).reduce((t,p)=>t+Math.max(0,p.agora+p.estC),0);const devo=ps.filter(p=>p.devedor===eu).reduce((t,p)=>t+Math.max(0,p.agora+p.estC),0);
    if(meDevem||devo)html+='<div class="section-title">Quem deve</div><button type="button" class="card" data-go="saldos" style="text-align:left;width:100%;display:block"><div class="kv"><span class="k">Devem para '+esc(eu)+'</span><span class="v" style="font-weight:700">'+brl(meDevem)+'</span><span class="k">'+esc(eu)+' deve</span><span class="v" style="font-weight:700">'+brl(devo)+'</span></div><div class="muted small" style="margin-top:8px">Planilha + o que foi lançado e pago no celular. Toque para ver por pessoa.</div></button>';}
  html+='<button type="button" class="btn block" data-pnhist="todos">Ver histórico de lançamentos</button>';
  html+='<div class="muted small" style="text-align:center">O painel usa só o que foi lançado neste celular. Os gastos que vêm direto da fatura continuam no Painel da planilha.</div></div>';
  v.innerHTML=html;
  v.querySelectorAll("[data-pnmes]").forEach(b=>b.onclick=()=>{if(b.disabled)return;S.pnMes=b.dataset.pnmes>hoje?hoje:b.dataset.pnmes;render()});

const CSV_COLS=["Tipo","ID","Data","Valor","Parcelas","ValorParcela","ValorDigitado","Meio","Banco","Titular","Final","PagoPor","Descricao","Loja","Rateio","Categoria","Observacao","Aproximado","Viagem","Pagador","Recebedor","Nome","Pessoas","Modo","De","Ate","Datas","Categorias","Meios","Excluido","CriadoEm","AlteradoEm","Por"];
function csvCell(v){v=v==null?"":String(v);return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
const brNum=c=>fmt(c).replace(/\./g,"").replace("−","-");
function gerarCSV(){
  const rows=[CSV_COLS.join(";")];
  const its=Object.values(S.items).sort((a,b)=>(a.criadoEm||"").localeCompare(b.criadoEm||""));
  for(const i of its){const r={Tipo:i.kind==="compra"?"Compra":i.kind==="pagamento"?"Pagamento":"Viagem",ID:i.id,Excluido:i.excluido?"Sim":"",CriadoEm:i.criadoEm,AlteradoEm:i.alteradoEm,Por:i.por};
    if(i.kind==="compra")Object.assign(r,{Data:i.data,Valor:brNum(i.valor),Parcelas:i.parcelas,ValorParcela:brNum(i.valorParcela),ValorDigitado:i.valorDigitado==="parcela"?"Parcela":"Total",Meio:i.tipoMeio,Banco:i.banco,Titular:i.titular,Final:i.final,PagoPor:i.pagoPor,Descricao:i.descricao,Loja:i.loja,Rateio:(i.viagem&&S.items[i.viagem]&&!S.items[i.viagem].excluido)?S.items[i.viagem].rateio:i.rateio,Categoria:i.categoria,Observacao:i.obs,Aproximado:i.aproximado?"Sim":"",Viagem:i.viagem?((S.items[i.viagem]||{}).nome||""):""});
    else if(i.kind==="pagamento")Object.assign(r,{Data:i.data,Valor:brNum(i.valor),Pagador:i.pagador,Recebedor:i.recebedor,Observacao:i.obs});
    else Object.assign(r,{Nome:i.nome,Rateio:i.rateio,Pessoas:(i.pessoas||[]).join("|"),Modo:i.modo==="datas"?"Datas":"Periodo",De:i.de,Ate:i.ate,Datas:(i.datas||[]).join("|"),Categorias:(i.categorias||[]).join("|"),Meios:(i.meios||[]).map(k=>{const m=meioByKey(k);return m?[m.tipo,m.banco,m.titular,m.final].join(":"):k}).join("|")});
    rows.push(CSV_COLS.map(c=>csvCell(r[c])).join(";"))}
  pessoasTodas().filter(p=>p.extra).forEach(p=>{const r={Tipo:"Pessoa",ID:"N-"+slug(p.nome),Nome:p.nome,Por:S.eu||""};rows.push(CSV_COLS.map(c=>csvCell(r[c])).join(";"))});
  return "﻿"+rows.join("\r\n")+"\r\n";
}
function nomeCSV(){return S.mode==="compartilhado"||S.mode==="offline"?"controle-celular.csv":"controle-celular-"+(slug(S.eu)||"aparelho")+"-"+deviceTag()+".csv"}
async function exportarCSV(){try{const ok=await saveFile(nomeCSV(),gerarCSV(),"text/csv");if(ok)marcarEnviado()}catch(e){if(e&&e.code==="declined")return;toast("Não deu para salvar aqui. Use Mostrar o arquivo.");}}
async function marcarEnviado(){S.app={...S.app,ultimoEnvio:nowIso(),ultimoEnvioPor:S.eu||""};lsSet("app",S.app);if(S.db){try{await S.db.doc("app/estado").set(S.app)}catch(e){}}toast("Arquivo pronto para a planilha");render()}
const SOLTO=!(window.claude&&typeof window.claude.use==="function");
function deviceTag(){let t=lsGet("device","");if(!t){t=Math.random().toString(36).slice(2,6);lsSet("device",t)}return t}
async function saveFile(name,data,mime){
  if(S.dl){const r=await S.dl.save({filename:name,data});return !!(r&&r.status==="saved")}
  const blob=data instanceof Blob?data:new Blob([data],{type:mime});
  try{const file=new File([blob],name,{type:mime});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return true}}
  catch(e){if(e&&e.name==="AbortError")return false}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return true;
}
function lerArquivo(fl){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result));r.onerror=()=>rej(r.error);r.readAsText(fl,"utf-8")})}
async function importarResumo(fl){
  let j;try{j=JSON.parse((await lerArquivo(fl)).replace(/^﻿/,""))}catch(e){toast("Esse arquivo não é o resumo da planilha.");return}
  if(!j||j.formato!=="controle-celular-resumo"){toast("Esse arquivo não é o resumo da planilha (resumo-celular.json).");return}
  const gen=Date.now().toString(36);const importadoEm=nowIso();
  const cel={};(j.celular||[]).forEach(c=>{if(c&&c.id)cel[c.id]={situacao:c.situacao,texto:c.texto||""}});
  const pares=(j.pares||[]).map(p=>({devedor:p.devedor,pagaA:p.pagaA,pendente:+p.pendente||0,aVencer:+p.aVencer||0}));
  const plan={gen,geradoEm:j.geradoEm,planilhaVersao:j.planilhaVersao||"",importadoEm,importadoPor:S.eu||"",pessoas:j.pessoas||[],meios:j.meios||[],categorias:j.categorias||[],lojas:j.lojas||[],pares:(j.pares||[]).map(p=>({devedor:p.devedor,pagaA:p.pagaA,pendente:+p.pendente||0,aVencer:+p.aVencer||0,itens:p.itens||[],pagamentos:p.pagamentos||[]})),celular:cel,partial:false};
  S.plan=plan;lsSet("plan",plan);render();
  if(!S.db){toast("Resumo de "+dtBR(j.geradoEm)+" carregado neste aparelho");return}
  toast("Enviando o resumo para os outros aparelhos…");
  try{
    const docs=[];const writes=[];
    plan.pares.forEach((p,i)=>{chunk(p.itens,250).forEach((part,k)=>{const name="par-"+gen+"-"+i+"-"+k;docs.push(name);writes.push([name,{tipo:"par",i,k,itens:part,pagamentos:k===0?p.pagamentos:[]}])});if(!p.itens.length){const name="par-"+gen+"-"+i+"-0";docs.push(name);writes.push([name,{tipo:"par",i,k:0,itens:[],pagamentos:p.pagamentos}])}});
    chunk(Object.entries(cel),1200).forEach((part,k)=>{const name="st-"+gen+"-"+k;docs.push(name);writes.push([name,{tipo:"status",celular:Object.fromEntries(part)}])});
    for(const [name,body] of writes)await S.db.collection("planilha").doc(name).set(body);
    const old=await S.db.doc("planilha/meta").get();const oldDocs=old.exists?(old.data().docs||[]):[];
    await S.db.doc("planilha/meta").set({gen,geradoEm:j.geradoEm,planilhaVersao:plan.planilhaVersao,importadoEm,importadoPor:plan.importadoPor,pessoas:plan.pessoas,meios:plan.meios,categorias:plan.categorias,lojas:plan.lojas,pares,docs});
    for(const name of oldDocs){if(!docs.includes(name)){try{await S.db.collection("planilha").doc(name).delete()}catch(e){}}}
    toast("Resumo de "+dtBR(j.geradoEm)+" salvo em todos os aparelhos");
  }catch(e){toast(e&&e.code==="invalid_argument"?"Sem permissão para gravar o resumo. Ficou só neste aparelho.":"Resumo carregado aqui, mas não chegou aos outros aparelhos. Tente de novo com internet.")}
}
function chunk(a,n){const o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o}
async function restaurar(fl){
  let j;try{j=JSON.parse((await lerArquivo(fl)).replace(/^﻿/,""))}catch(e){toast("Arquivo de backup inválido.");return}
  if(!j||j.formato!=="controle-celular-backup"||!Array.isArray(j.itens)){toast("Esse arquivo não é um backup deste app.");return}
  let n=0;for(const it of j.itens){if(!it||!it.id||!it.kind)continue;const cur=S.items[it.id];if(!cur||(it.alteradoEm||"")>(cur.alteradoEm||"")){S.items[it.id]=it;S.outbox[it.id]=1;n++}}
  persist();flush();render();toast(n?n+" itens restaurados":"Nada novo no backup");
}

/* ---------- start ---------- */
(function start(){
  const r=location.hash.slice(1);if(TITLES[r])S.route=r;
  render();initCaps();
  if(SOLTO&&location.protocol==="https:"&&"serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
})();
</script>
